<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WorkRoster My Shifts</title>
  <link rel="stylesheet" href="employee.css">
</head>
<body>

  <!-- Top bar -->
  <header class="topbar">
    <div class="brand">
      <img src="logo.png" alt="WorkRoster logo" class="brand-logo">
      <span class="brand-name">WorkRoster</span>
      <span class="role-tag">Employee</span>
    </div>
    <div class="user-area">
      <span id="userEmail"></span>
      <button class="btn btn-outline" onclick="logout()">Log out</button>
    </div>
  </header>

  <main class="page">

    <!-- Shown if something goes wrong (for example, the backend is off) -->
    <div id="banner" class="banner hidden"></div>

    <!-- Next shift -->
    <section class="next-shift">
      <p class="next-label">Your next shift</p>
      <p id="nextShiftWhen" class="next-when">No upcoming shifts</p>
      <p id="nextShiftDetail" class="next-detail"></p>
    </section>

    <!-- Title row with week navigation -->
    <div class="title-row">
      <div>
        <h1>My Shifts</h1>
        <p id="weekLabel" class="week-label"></p>
      </div>
      <div class="week-nav">
        <button class="btn btn-outline" onclick="changeWeek(-1)">&larr; Previous</button>
        <button class="btn btn-outline" onclick="goToThisWeek()">This week</button>
        <button class="btn btn-outline" onclick="changeWeek(1)">Next &rarr;</button>
      </div>
    </div>

    <!-- Summary cards -->
    <section class="cards">
      <div class="card">
        <p class="card-label">Shifts this week</p>
        <p id="statShifts" class="card-value">0</p>
      </div>
      <div class="card">
        <p class="card-label">Hours this week</p>
        <p id="statHours" class="card-value">0</p>
      </div>
      <div class="card">
        <p class="card-label">Days off</p>
        <p id="statDaysOff" class="card-value">7</p>
      </div>
    </section>

    <!-- Shown instead of the list when the manager hasn't published the week -->
    <div id="notPublished" class="not-published hidden">
      <p class="not-published-title">Schedule not published yet</p>
      <p>Your manager hasn't published the schedule for this week. Check back later.</p>
    </div>

    <!-- One row per day -->
    <section id="dayList" class="day-list"></section>

  </main>

  <script src="employee.js"></script>
</body>
</html>
